version: "3.9"
services:
  bid-pucp-db:
    image: postgres
    restart: always
    container_name: bid-pucp-db
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: bidbuddy
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres 

volumes:
  postgres: